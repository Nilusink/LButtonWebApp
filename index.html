<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Website</title>
    <link rel="stylesheet" href="./static/index.css?v=1.2">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main id="hearts">
       <div class="headline">
        <h1 style>
            I love You<br>
            ❤️
        </h1>
       </div>
       <div class="button_holder">
        <button id="btn" class="lbutton">
            Nudge!
        </button>
       </div>
       <div class="motd_holder">
        <div class="motd_box">
            <div class="motd_title_box">
                <span>Message of the day:</span>
                <button id="motd_edit_button" type="button">+</button>
            </div>
            <dialog id="motd_dialog">
            <form id="motd_form">
                <h2>Write a message ♡</h2>

                <textarea
                    id="motd_input"
                    placeholder="Write something ..."
                    required
                    maxlength="1000"
                ></textarea>

                <div class="motd_dialog_buttons">
                    <button type="button" id="motd_cancel">Cancel</button>
                    <button type="submit" id="motd_send">Send ♡</button>
                </div>

                <p id="motd_status" role="status"></p>
            </form>
        </dialog>
            <div id="motd" class="motd">
            </div>
        </div>
       </div>
    </main>
    <script src="./js/animations.js"></script>
    <script src="./js/api.js"></script>
  </body>
</html>
